name: Test diagnostic 3T-K panel sufficiency

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_runtime.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3o_synthesis.py'
      - 'scripts/diagnostic_3r_page.py'
      - '.github/workflows/test-diagnostic-3tk-panel-sufficiency.yml'

env:
  DIAG_TERRITORY: '16015'
  DIAG_COMMUNE_NAME: 'Angoulême'
  DIAG_PANEL_CODES: '16102,19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,17306,47323,47157'

jobs:
  base_layer_threshold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer jusqu'à 3L
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py

      - name: Tester n=9 puis n=10 dans 3M
        run: |
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3kg-assembly.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['blocks']['social_housing']['panel']['reference_n']=9
          d['blocks']['social_housing']['panel']['percentiles']['mobilite_pct']=100.0
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python scripts/diagnostic_3m_discriminants.py
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m-discriminants.json',encoding='utf-8'))
          f={x['id']:x for x in d['discriminant_factors']+d['non_discriminant_comparators']}['social_mobility']
          assert f['reference_panel_n']==9
          assert f['minimum_reference_panel_n']==10
          assert f['comparison_sufficient'] is False
          assert f['direction']=='panel_insuffisant'
          assert f['is_discriminant'] is False
          print('3TK_N9_SUPPRESSED_OK')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3kg-assembly.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['blocks']['social_housing']['panel']['reference_n']=10
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python scripts/diagnostic_3m_discriminants.py
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m-discriminants.json',encoding='utf-8'))
          f={x['id']:x for x in d['discriminant_factors']+d['non_discriminant_comparators']}['social_mobility']
          assert f['reference_panel_n']==10
          assert f['comparison_sufficient'] is True
          assert f['is_discriminant'] is True
          print('3TK_N10_INTERPRETABLE_OK')
          PY

  extended_layer_and_page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer jusqu'à 3M-P
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py

      - name: Forcer DVF à n=9 avec percentile extrême
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3mp-panels.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          st=d['blocks']['dvf']['stats']['median_price_m2_eur_simple']
          st['panel_n']=9
          st['percentile']=100.0
          d['quality']['status']='partial'
          d['quality']['all_panel_stats_complete']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TK_DVF_N9_INJECTED')
          PY

      - name: Terminer jusqu'à 3R
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
          python scripts/diagnostic_3r_page.py

      - name: Vérifier neutralisation et affichage
        run: |
          python - <<'PY'
          import json
          m=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          r=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))
          f={x['id']:x for x in m['discriminant_factors']+m['non_discriminant_comparators']}['dvf_median_price_m2']
          assert f['reference_panel_n']==9
          assert f['minimum_reference_panel_n']==10
          assert f['comparison_sufficient'] is False
          assert f['direction']=='panel_insuffisant'
          assert f['is_discriminant'] is False
          assert 'dvf_median_price_m2' not in {x['id'] for x in r['discriminant_factors']}
          k=next(x for x in r['kpis'] if x['label']=='Prix médian DVF 2025')
          assert 'Panel insuffisant' in k['detail']
          assert 'minimum 10' in k['detail']
          print('3TK_PAGE_DISCLOSURE_OK')
          PY
