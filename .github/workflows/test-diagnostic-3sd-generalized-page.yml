name: Test diagnostic 3S-D generalized final page

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_runtime.py'
      - 'scripts/lovac_3kb_contract.py'
      - 'scripts/insee_log1_3kc_contract.py'
      - 'scripts/dvf_3kd_contract.py'
      - 'scripts/sitadel_3ke_contract.py'
      - 'scripts/rpls_3kf_contract.py'
      - 'scripts/insee_3jc_contract.py'
      - 'scripts/filosofi_panel_contract_3icde.py'
      - 'scripts/diagnostic_3kg_assembly.py'
      - 'scripts/diagnostic_3l_interpretation.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3o_synthesis.py'
      - 'scripts/diagnostic_3p_levers.py'
      - 'scripts/diagnostic_3q_prioritization.py'
      - 'scripts/diagnostic_3r_page.py'
      - '.github/workflows/test-diagnostic-3sd-generalized-page.yml'

jobs:
  angouleme_page_regression:
    runs-on: ubuntu-24.04
    env:
      DIAG_TERRITORY: '16015'
      DIAG_COMMUNE_NAME: 'Angoulême'
      DIAG_PANEL_CODES: '19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,16102,17306,47323,47157'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le diagnostic complet
        run: |
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
          python scripts/diagnostic_3r_page.py
      - name: Vérifier la non-régression de la page
        run: |
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))
          h=open('output/diagnostic-3r-page.html',encoding='utf-8').read()
          assert d['territory']=='16015'
          assert d['subtitle']=='Angoulême · code INSEE 16015'
          o=json.load(open('output/diagnostic-3o-synthesis.json',encoding='utf-8'))
          q=json.load(open('output/diagnostic-3q-priorities.json',encoding='utf-8'))
          kg=json.load(open('output/diagnostic-3kg-assembly.json',encoding='utf-8'))
          assert d['method']['panel_reference_n']==15
          assert d['quality']['kpi_count']==len(d['kpis'])==8
          assert d['quality']['discriminant_factor_count']==len(d['discriminant_factors'])==len(o['discriminant_factors'])
          assert d['quality']['hypothesis_count']==len(d['hypotheses'])==len(o['hypotheses'])
          assert d['quality']['priority_count']==len(d['priorities'])==len(q['priorities'])
          assert d['source_provenance']==kg['source_provenance']
          assert d['quality']['source_provenance_count']==7
          assert d['runtime']['territory_source']=='env'
          assert '<strong>Angoulême</strong> · code INSEE 16015.' in h
          assert 'Sources et millésimes' in h
          print('ANGOULEME_3SD_PAGE_OK')
          PY

  cognac_page_generic:
    runs-on: ubuntu-24.04
    env:
      DIAG_TERRITORY: '16102'
      DIAG_COMMUNE_NAME: 'Cognac'
      DIAG_PANEL_CODES: '19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,16015,17306,47323,47157'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le diagnostic Cognac complet
        run: |
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
          python scripts/diagnostic_3r_page.py
      - name: Vérifier la page Cognac
        run: |
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))
          h=open('output/diagnostic-3r-page.html',encoding='utf-8').read()
          assert d['territory']=='16102'
          assert d['subtitle']=='Cognac · code INSEE 16102'
          o=json.load(open('output/diagnostic-3o-synthesis.json',encoding='utf-8'))
          q=json.load(open('output/diagnostic-3q-priorities.json',encoding='utf-8'))
          kg=json.load(open('output/diagnostic-3kg-assembly.json',encoding='utf-8'))
          assert d['method']['panel_reference_n']==15
          assert d['quality']['kpi_count']==len(d['kpis'])==8
          assert d['quality']['discriminant_factor_count']==len(d['discriminant_factors'])==len(o['discriminant_factors'])
          assert d['quality']['hypothesis_count']==len(d['hypotheses'])==len(o['hypotheses'])
          assert d['quality']['priority_count']==len(d['priorities'])==len(q['priorities'])
          assert d['source_provenance']==kg['source_provenance']
          assert d['quality']['source_provenance_count']==7
          assert d['runtime']['territory_source']=='env'
          assert '<strong>Cognac</strong> · code INSEE 16102.' in h
          assert 'Angoulême</strong> · code INSEE 16015' not in h
          if not d['hypotheses']:
              assert 'Aucune hypothèse n’est déclenchée' in h
          assert 'Sources et millésimes' in h
          print('COGNAC_3SD_PAGE_OK')
          PY
      - name: Publier la page Cognac
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3sd-cognac-final-page
          path: |
            output/diagnostic-3r-page.json
            output/diagnostic-3r-page.html
