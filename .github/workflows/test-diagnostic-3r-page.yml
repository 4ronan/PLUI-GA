name: Test diagnostic 3R final page

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_3kg_assembly.py'
      - 'scripts/diagnostic_3r_page.py'
      - 'scripts/diagnostic_3q_prioritization.py'
      - 'scripts/diagnostic_3p_levers.py'
      - 'scripts/diagnostic_3o_synthesis.py'
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/rpls_3kf_contract.py'
      - '.github/workflows/test-diagnostic-3r-page.yml'

jobs:
  final_page_deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer LOVAC
        run: python scripts/lovac_3kb_contract.py
      - name: Générer INSEE LOG1
        run: python scripts/insee_log1_3kc_contract.py
      - name: Générer DVF
        run: python scripts/dvf_3kd_contract.py
      - name: Générer Sitadel
        run: python scripts/sitadel_3ke_contract.py
      - name: Générer RPLS
        run: python scripts/rpls_3kf_contract.py
      - name: Générer démographie-logement INSEE
        run: python scripts/insee_3jc_contract.py
      - name: Générer Filosofi
        run: python scripts/filosofi_panel_contract_3icde.py
      - name: Assembler 3K-G
        run: python scripts/diagnostic_3kg_assembly.py
      - name: Interpréter 3L
        run: python scripts/diagnostic_3l_interpretation.py
      - name: Détecter 3M initial
        run: python scripts/diagnostic_3m_discriminants.py
      - name: Matérialiser 3M-P
        run: python scripts/diagnostic_3mp_missing_panels.py
      - name: Recalculer 3M-2
        run: python scripts/diagnostic_3m2_discriminants_extended.py
      - name: Générer 3N sans IA
        run: python scripts/diagnostic_3n_hypotheses.py
      - name: Assembler 3O sans IA
        run: python scripts/diagnostic_3o_synthesis.py
      - name: Générer 3P sans IA
        run: python scripts/diagnostic_3p_levers.py
      - name: Prioriser 3Q sans IA
        run: python scripts/diagnostic_3q_prioritization.py
      - name: Générer la page 3R sans IA
        run: python scripts/diagnostic_3r_page.py
      - name: Vérifier 3R
        run: |
          test -s output/diagnostic-3r-page.json
          test -s output/diagnostic-3r-page.html
          grep -q '<!doctype html>' output/diagnostic-3r-page.html
          grep -q 'Diagnostic territorial de la vacance des logements' output/diagnostic-3r-page.html
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))
          assert d['stage']=='3R'
          assert d['territory']=='16015'
          assert d['quality']['status']=='ok'
          o=json.load(open('output/diagnostic-3o-synthesis.json',encoding='utf-8'))
          q=json.load(open('output/diagnostic-3q-priorities.json',encoding='utf-8'))
          kg=json.load(open('output/diagnostic-3kg-assembly.json',encoding='utf-8'))
          assert d['quality']['kpi_count']==len(d['kpis'])==8
          assert d['quality']['discriminant_factor_count']==len(d['discriminant_factors'])==len(o['discriminant_factors'])
          assert d['quality']['hypothesis_count']==len(d['hypotheses'])==len(o['hypotheses'])
          assert d['quality']['priority_count']==len(d['priorities'])==len(q['priorities'])
          assert d['priorities']==q['priorities']
          expected_sources={'vacancy_private','vacant_stock_profile','real_estate_market','construction','social_housing','demography_housing','socioeconomic_context'}
          assert set(d['source_provenance'])==expected_sources
          assert d['quality']['source_provenance_count']==7
          assert d['source_provenance']==kg['source_provenance']
          assert all(x.get('source') and x.get('period_label') and x.get('availability_policy') for x in d['source_provenance'].values())
          assert d['quality']['llm_used'] is False
          assert d['quality']['external_knowledge_lookup_used'] is False
          assert d['quality']['free_text_generation'] is False
          print(json.dumps(d['quality'],ensure_ascii=False,indent=2))
          PY
      - name: Publier 3R
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3r-final-page
          path: |
            output/diagnostic-3r-page.json
            output/diagnostic-3r-page.html
