name: Test diagnostic 3M-2 discriminants

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - '.github/workflows/test-diagnostic-3m2-discriminants.yml'

jobs:
  discriminants_extended:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer LOVAC
        run: python scripts/lovac_3kb_contract.py
      - name: Générer INSEE LOG1
        run: python scripts/insee_log1_3kc_contract.py
      - name: Générer DVF
        run: python scripts/dvf_3kd_contract.py
      - name: Générer Sitadel
        run: python scripts/sitadel_3ke_contract.py
      - name: Générer RPLS
        run: python scripts/rpls_3kf_contract.py
      - name: Générer démographie-logement INSEE
        run: python scripts/insee_3jc_contract.py
      - name: Générer Filosofi
        run: python scripts/filosofi_panel_contract_3icde.py
      - name: Assembler 3K-G
        run: python scripts/diagnostic_3kg_assembly.py
      - name: Interpréter 3L
        run: python scripts/diagnostic_3l_interpretation.py
      - name: Détecter 3M initial
        run: python scripts/diagnostic_3m_discriminants.py
      - name: Matérialiser 3M-P
        run: python scripts/diagnostic_3mp_missing_panels.py
      - name: Recalculer 3M-2
        run: python scripts/diagnostic_3m2_discriminants_extended.py
      - name: Vérifier 3M-2
        run: |
          test -s output/diagnostic-3m2-discriminants.json
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          assert d['stage']=='3M-2'
          assert d['territory']=='16015'
          assert d['quality']['status']=='ok'
          assert d['quality']['candidate_count']==16
          assert d['quality']['discriminant_count']==6
          assert d['quality']['all_candidates_have_panel'] is True
          assert d['quality']['causal_claims_included'] is False
          assert d['quality']['recommendations_included'] is False
          ids={x['id'] for x in d['discriminant_factors']}
          assert ids=={'median_income','poverty_rate','social_mobility','social_qpv_share','dvf_median_price_m2','sitadel_started_intensity'}
          print(json.dumps({'quality':d['quality'],'discriminants':d['discriminant_factors']},ensure_ascii=False,indent=2))
          PY
      - name: Publier 3M-2
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3m2-discriminants
          path: output/diagnostic-3m2-discriminants.json
