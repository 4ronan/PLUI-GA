name: Test RPLS 2025 Angouleme

on:
  push:
    branches:
      - vacants-rpls-d2
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer les dependances R
        run: |
          install.packages(c("remotes","jsonlite","dplyr"))
        shell: Rscript {0}

      - name: Installer propre.rpls depuis la forge publique
        run: |
          remotes::install_gitlab(
            repo = "pub/cgdd-public/sdes-dreal/propre.rpls",
            host = "gitlab-forge.din.developpement-durable.gouv.fr",
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Extraire Angouleme 16015 - millesime 2025
        run: Rscript scripts/test_rpls_angouleme.R

      - name: Publier le resultat comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: rpls-2025-angouleme
          path: output/rpls-2025-angouleme.json
