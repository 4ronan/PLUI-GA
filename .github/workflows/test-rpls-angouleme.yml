name: Test RPLS 2025 Angouleme

on:
  push:
    branches:
      - vacants-rpls-d2
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer les dependances R minimales
        run: |
          install.packages(c("jsonlite","dplyr"))
        shell: Rscript {0}

      - name: Telecharger les sources publiques propre.rpls
        run: |
          curl --fail --location --retry 3 \
            "https://gitlab-forge.din.developpement-durable.gouv.fr/api/v4/projects/28046/repository/archive.tar.gz?sha=HEAD" \
            -o propre-rpls.tar.gz
          mkdir -p vendor/propre-rpls
          tar -xzf propre-rpls.tar.gz -C vendor/propre-rpls --strip-components=1
          echo "Fichiers de donnees trouves :"
          find vendor/propre-rpls -type f \( -iname '*.rda' -o -iname '*.RData' -o -iname '*.rds' \) -print | head -100

      - name: Extraire Angouleme 16015 - millesime 2025
        run: Rscript scripts/test_rpls_angouleme.R vendor/propre-rpls

      - name: Publier le resultat comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: rpls-2025-angouleme
          path: output/rpls-2025-angouleme.json
