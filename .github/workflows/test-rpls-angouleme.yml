name: Test RPLS 2025 Angouleme

on:
  push:
    branches:
      - vacants-rpls-d2
    paths:
      - 'scripts/test_rpls_angouleme.R'
      - '.github/workflows/test-rpls-angouleme.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer les dependances R minimales
        run: |
          install.packages(c("jsonlite","dplyr"))
        shell: Rscript {0}

      - name: Telecharger les sources publiques propre.rpls
        run: |
          url="https://gitlab-forge.din.developpement-durable.gouv.fr/api/v4/projects/28046/repository/archive.tar.gz?sha=HEAD"
          rm -f propre-rpls.tar.gz
          for attempt in 1 2 3 4 5; do
            echo "Téléchargement RPLS — tentative $attempt/5"
            if curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 60 --speed-time 180 --speed-limit 1024 \
              --continue-at - "$url" -o propre-rpls.tar.gz; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Échec du téléchargement après 5 tentatives" >&2
              exit 1
            fi
            sleep 10
          done
          mkdir -p vendor/propre-rpls
          tar -xzf propre-rpls.tar.gz -C vendor/propre-rpls --strip-components=1
          echo "Fichiers de donnees trouves :"
          find vendor/propre-rpls -type f \( -iname '*.rda' -o -iname '*.RData' -o -iname '*.rds' \) -print | head -100

      - name: Extraire Angouleme 16015 - millesime 2025
        run: Rscript scripts/test_rpls_angouleme.R vendor/propre-rpls

      - name: Publier le resultat comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: rpls-2025-angouleme
          path: output/rpls-2025-angouleme.json
