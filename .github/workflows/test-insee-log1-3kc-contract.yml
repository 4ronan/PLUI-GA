name: Test INSEE LOG1 3K-C contract

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/insee_log1_3kc_contract.py'
      - '.github/workflows/test-insee-log1-3kc-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le contrat INSEE LOG1 2023
        run: python scripts/insee_log1_3kc_contract.py
      - name: Vérifier le contrat
        run: |
          test -s output/insee-log1-3kc-contract.json
          python - <<'PY'
          import json
          d=json.load(open('output/insee-log1-3kc-contract.json',encoding='utf-8'))
          assert d['territory']=='16015'
          assert d['year']==2023
          assert d['merge_with_lovac'] is False
          assert d['causal_interpretation'] is False
          assert d['quality']['nor_excluded'] is True
          assert d['quality']['status']=='ok'
          assert len(d['metrics']['by_construction_period'])==6
          assert len(d['metrics']['by_dwelling_type'])==3
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Publier le contrat 3K-C
        uses: actions/upload-artifact@v4
        with:
          name: insee-log1-3kc-contract
          path: output/insee-log1-3kc-contract.json
