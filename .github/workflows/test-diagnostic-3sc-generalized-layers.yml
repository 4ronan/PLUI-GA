name: Test diagnostic 3S-C generalized layers

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_runtime.py'
      - 'scripts/lovac_3kb_contract.py'
      - 'scripts/insee_log1_3kc_contract.py'
      - 'scripts/dvf_3kd_contract.py'
      - 'scripts/sitadel_3ke_contract.py'
      - 'scripts/rpls_3kf_contract.py'
      - 'scripts/insee_3jc_contract.py'
      - 'scripts/filosofi_panel_contract_3icde.py'
      - 'scripts/diagnostic_3kg_assembly.py'
      - 'scripts/diagnostic_3l_interpretation.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3o_synthesis.py'
      - 'scripts/diagnostic_3p_levers.py'
      - 'scripts/diagnostic_3q_prioritization.py'
      - '.github/workflows/test-diagnostic-3sc-generalized-layers.yml'

jobs:
  angouleme_full_regression:
    runs-on: ubuntu-24.04
    env:
      DIAG_TERRITORY: '16015'
      DIAG_COMMUNE_NAME: 'Angoulême'
      DIAG_PANEL_CODES: '19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,16102,17306,47323,47157'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exécuter le pipeline jusqu’à 3Q
        run: |
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
      - name: Vérifier Angoulême
        run: |
          python - <<'PY'
          import json
          q=json.load(open('output/diagnostic-3q-priorities.json',encoding='utf-8'))
          m2=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          n=json.load(open('output/diagnostic-3n-hypotheses.json',encoding='utf-8'))
          assert q['territory']=='16015'
          assert q['quality']['status']=='ok'
          assert len(q['priorities'])==4
          assert len(m2['discriminant_factors'])==6
          assert len(n['hypotheses'])==3
          assert q['runtime']['territory_source']=='env'
          print('ANGOULEME_FULL_3SC_OK')
          PY

  cognac_full_generic:
    runs-on: ubuntu-24.04
    env:
      DIAG_TERRITORY: '16102'
      DIAG_COMMUNE_NAME: 'Cognac'
      DIAG_PANEL_CODES: '19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,16015,17306,47323,47157'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exécuter le pipeline Cognac jusqu’à 3Q
        run: |
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
      - name: Vérifier Cognac
        run: |
          python - <<'PY'
          import json
          k=json.load(open('output/diagnostic-3kg-assembly.json',encoding='utf-8'))
          l=json.load(open('output/diagnostic-3l-interpretation.json',encoding='utf-8'))
          mp=json.load(open('output/diagnostic-3mp-panels.json',encoding='utf-8'))
          m2=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          n=json.load(open('output/diagnostic-3n-hypotheses.json',encoding='utf-8'))
          o=json.load(open('output/diagnostic-3o-synthesis.json',encoding='utf-8'))
          p=json.load(open('output/diagnostic-3p-levers.json',encoding='utf-8'))
          q=json.load(open('output/diagnostic-3q-priorities.json',encoding='utf-8'))
          docs=[k,l,mp,m2,n,o,p,q]
          assert all(x['territory']=='16102' for x in docs)
          assert all(x.get('quality',{}).get('status')=='ok' for x in docs)
          assert mp['quality']['reference_n']==15
          assert '16102' not in mp['quality']['panel_codes'][1:]
          assert q['runtime']['territory_source']=='env'
          assert len(q['priorities'])>=1
          text=' '.join(s['text'] for sec in l['sections'] for s in sec['statements'])
          assert 'Angoulême' not in text
          assert 'Cognac' in text
          print('COGNAC_FULL_3SC_OK')
          PY
      - name: Publier preuve Cognac 3S-C
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3sc-cognac-through-3q
          path: |
            output/diagnostic-3kg-assembly.json
            output/diagnostic-3l-interpretation.json
            output/diagnostic-3m-discriminants.json
            output/diagnostic-3mp-panels.json
            output/diagnostic-3m2-discriminants.json
            output/diagnostic-3n-hypotheses.json
            output/diagnostic-3o-synthesis.json
            output/diagnostic-3p-levers.json
            output/diagnostic-3q-priorities.json
