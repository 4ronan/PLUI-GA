name: Export RPLS 2025 national

on:
  push:
    branches:
      - vacants-rpls-d2
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer les dependances R minimales
        run: |
          install.packages(c("jsonlite","dplyr"))
        shell: Rscript {0}

      - name: Telecharger les sources publiques propre.rpls
        run: |
          curl --fail --location --retry 3 \
            "https://gitlab-forge.din.developpement-durable.gouv.fr/api/v4/projects/28046/repository/archive.tar.gz?sha=HEAD" \
            -o propre-rpls.tar.gz
          mkdir -p vendor/propre-rpls
          tar -xzf propre-rpls.tar.gz -C vendor/propre-rpls --strip-components=1

      - name: Exporter le millesime 2025 communal
        run: Rscript scripts/export_rpls_2025_national.R vendor/propre-rpls

      - name: Publier le CSV et les controles
        uses: actions/upload-artifact@v4
        with:
          name: rpls-2025-communes
          path: |
            output/rpls-2025-communes.csv
            output/rpls-2025-checks.json
