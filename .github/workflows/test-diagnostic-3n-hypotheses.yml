name: Test diagnostic 3N hypotheses

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - '.github/workflows/test-diagnostic-3n-hypotheses.yml'

jobs:
  hypotheses_deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer LOVAC
        run: python scripts/lovac_3kb_contract.py
      - name: Générer INSEE LOG1
        run: python scripts/insee_log1_3kc_contract.py
      - name: Générer DVF
        run: python scripts/dvf_3kd_contract.py
      - name: Générer Sitadel
        run: python scripts/sitadel_3ke_contract.py
      - name: Générer RPLS
        run: python scripts/rpls_3kf_contract.py
      - name: Générer démographie-logement INSEE
        run: python scripts/insee_3jc_contract.py
      - name: Générer Filosofi
        run: python scripts/filosofi_panel_contract_3icde.py
      - name: Assembler 3K-G
        run: python scripts/diagnostic_3kg_assembly.py
      - name: Interpréter 3L
        run: python scripts/diagnostic_3l_interpretation.py
      - name: Détecter 3M initial
        run: python scripts/diagnostic_3m_discriminants.py
      - name: Matérialiser 3M-P
        run: python scripts/diagnostic_3mp_missing_panels.py
      - name: Recalculer 3M-2
        run: python scripts/diagnostic_3m2_discriminants_extended.py
      - name: Générer 3N sans IA
        run: python scripts/diagnostic_3n_hypotheses.py

      - name: Vérifier 3N
        run: |
          test -s output/diagnostic-3n-hypotheses.json
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3n-hypotheses.json',encoding='utf-8'))
          assert d['stage']=='3N'
          assert d['territory']=='16015'
          assert d['source_stage']=='3M-2'
          assert d['generation']['mode']=='deterministic_rule_engine'
          assert d['generation']['llm_used'] is False
          assert d['generation']['external_knowledge_used'] is False
          assert d['generation']['web_used'] is False
          assert d['generation']['network_calls'] is False
          assert d['generation']['free_text_generation'] is False
          assert d['quality']['status']=='ok'
          assert d['quality']['all_hypotheses_traceable_to_3m2'] is True
          assert d['quality']['causal_claims_included'] is False
          assert d['quality']['recommendations_included'] is False
          assert d['quality']['global_score_included'] is False
          ids={x['id'] for x in d['hypotheses']}
          assert ids=={
              'H1_socioeconomic_market_convergence',
              'H2_construction_pipeline_gap',
              'H3_social_housing_configuration',
          }
          guards={x['id'] for x in d['guardrails']}
          assert guards=={
              'G1_no_relative_excess_private_vacancy',
              'G2_no_atypical_vacant_profile',
          }
          conf={x['id']:x['confidence'] for x in d['hypotheses']}
          assert conf['H1_socioeconomic_market_convergence']=='moyen'
          assert conf['H2_construction_pipeline_gap']=='faible'
          assert conf['H3_social_housing_configuration']=='faible'
          print(json.dumps({'quality':d['quality'],'hypotheses':d['hypotheses'],'guardrails':d['guardrails']},ensure_ascii=False,indent=2))
          PY

      - name: Publier 3N
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3n-hypotheses
          path: output/diagnostic-3n-hypotheses.json
