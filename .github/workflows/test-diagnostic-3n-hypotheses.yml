name: Test diagnostic 3N hypotheses

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3m2_discriminants_extended.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - '.github/workflows/test-diagnostic-3n-hypotheses.yml'

jobs:
  hypotheses_deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer LOVAC
        run: python scripts/lovac_3kb_contract.py
      - name: Générer INSEE LOG1
        run: python scripts/insee_log1_3kc_contract.py
      - name: Générer DVF
        run: python scripts/dvf_3kd_contract.py
      - name: Générer Sitadel
        run: python scripts/sitadel_3ke_contract.py
      - name: Générer RPLS
        run: python scripts/rpls_3kf_contract.py
      - name: Générer démographie-logement INSEE
        run: python scripts/insee_3jc_contract.py
      - name: Générer Filosofi
        run: python scripts/filosofi_panel_contract_3icde.py
      - name: Assembler 3K-G
        run: python scripts/diagnostic_3kg_assembly.py
      - name: Interpréter 3L
        run: python scripts/diagnostic_3l_interpretation.py
      - name: Détecter 3M initial
        run: python scripts/diagnostic_3m_discriminants.py
      - name: Matérialiser 3M-P
        run: python scripts/diagnostic_3mp_missing_panels.py
      - name: Recalculer 3M-2
        run: python scripts/diagnostic_3m2_discriminants_extended.py
      - name: Générer 3N sans IA
        run: python scripts/diagnostic_3n_hypotheses.py

      - name: Vérifier 3N
        run: |
          test -s output/diagnostic-3n-hypotheses.json
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3n-hypotheses.json',encoding='utf-8'))
          assert d['stage']=='3N'
          assert d['territory']=='16015'
          assert d['source_stage']=='3M-2'
          assert d['generation']['mode']=='deterministic_rule_engine'
          assert d['generation']['llm_used'] is False
          assert d['generation']['external_knowledge_used'] is False
          assert d['generation']['web_used'] is False
          assert d['generation']['network_calls'] is False
          assert d['generation']['free_text_generation'] is False
          assert d['quality']['status']=='ok'
          assert d['quality']['all_hypotheses_traceable_to_3m2'] is True
          assert d['quality']['causal_claims_included'] is False
          assert d['quality']['recommendations_included'] is False
          assert d['quality']['global_score_included'] is False
          m2=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          factors={x['id']:x for x in m2['discriminant_factors']+m2['non_discriminant_comparators']}
          def sufficient(*ids):
              return all(factors[i].get('comparison_sufficient',True) for i in ids)
          expected=set()
          mi,pov,price=(factors[i] for i in ('median_income','poverty_rate','dvf_median_price_m2'))
          if sufficient('median_income','poverty_rate','dvf_median_price_m2') and mi['direction'] in {'faible','tres_faible'} and pov['direction'] in {'eleve','tres_eleve'} and price['direction'] in {'faible','tres_faible'}:
              expected.add('H1_socioeconomic_market_convergence')
          aut,started=(factors[i] for i in ('sitadel_authorized_intensity','sitadel_started_intensity'))
          if sufficient('sitadel_authorized_intensity','sitadel_started_intensity') and started['direction'] in {'faible','tres_faible'} and aut['percentile'] is not None and 25 < float(aut['percentile']) < 75:
              expected.add('H2_construction_pipeline_gap')
          mob,qpv,svac=(factors[i] for i in ('social_mobility','social_qpv_share','social_vacancy'))
          if sufficient('social_mobility','social_qpv_share','social_vacancy') and mob['direction'] in {'eleve','tres_eleve'} and qpv['direction'] in {'eleve','tres_eleve'} and not svac['is_discriminant']:
              expected.add('H3_social_housing_configuration')
          ids={x['id'] for x in d['hypotheses']}
          assert ids==expected

          expected_guards=set()
          priv,structural,apt,age=(factors[i] for i in ('private_vacancy_rate','private_structural_vacancy_rate','vacant_apartment_share','vacant_1946_1990_share'))
          if sufficient('private_vacancy_rate','private_structural_vacancy_rate') and not priv['is_discriminant'] and not structural['is_discriminant']:
              expected_guards.add('G1_no_relative_excess_private_vacancy')
          if sufficient('vacant_apartment_share','vacant_1946_1990_share') and apt.get('percentile') is not None and age.get('percentile') is not None and not apt['is_discriminant'] and not age['is_discriminant']:
              expected_guards.add('G2_no_atypical_vacant_profile')
          guards={x['id'] for x in d['guardrails']}
          assert guards==expected_guards

          for h in d['hypotheses']:
              domains={x['domain'] for x in (factors[i] for i in h['supporting_factor_ids'])}
              expected_conf='eleve' if len(domains)>=3 else ('moyen' if len(domains)==2 else 'faible')
              assert h['confidence']==expected_conf
              assert all(factors[i].get('comparison_sufficient',True) for i in h['supporting_factor_ids'])
          print(json.dumps({'quality':d['quality'],'hypotheses':d['hypotheses'],'guardrails':d['guardrails']},ensure_ascii=False,indent=2))
          PY

      - name: Publier 3N
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3n-hypotheses
          path: output/diagnostic-3n-hypotheses.json
