name: Test diagnostic 3T-G LOG1 missingness

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/insee_log1_3kc_contract.py'
      - 'scripts/diagnostic_3l_interpretation.py'
      - 'scripts/diagnostic_3mp_missing_panels.py'
      - 'scripts/diagnostic_3n_hypotheses.py'
      - 'scripts/diagnostic_3o_synthesis.py'
      - 'scripts/diagnostic_3p_levers.py'
      - 'scripts/diagnostic_3r_page.py'
      - '.github/workflows/test-diagnostic-3tg-log1-missingness.yml'

env:
  DIAG_TERRITORY: '16015'
  DIAG_COMMUNE_NAME: 'Angoulême'
  DIAG_PANEL_CODES: '16102,19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,17306,47323,47157'

jobs:
  missing_target_log1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les contrats source
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py

      - name: Simuler un profil LOG1 cible indisponible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/insee-log1-3kc-contract.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['metrics']['vacant_total']=None
          d['metrics']['published_total']=None
          for x in d['metrics']['by_construction_period']:
              x['value']=None
              x['share_pct']=None
          for x in d['metrics']['by_dwelling_type']:
              x['value']=None
              x['share_pct']=None
          d['quality']['target_profile_available']=False
          d['quality']['status']='partial'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TG_TARGET_LOG1_GAP_INJECTED')
          PY

      - name: Construire jusqu'à 3M-P
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py

      - name: Rendre aussi la cible LOG1 indisponible dans le panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3mp-panels.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          b=d['blocks']['insee_log1_vacant_profile']
          for key in ('vacant_apartment_share_pct','vacant_1946_1990_share_pct'):
              b['stats'][key]['target']=None
              b['stats'][key]['percentile']=None
          d['quality']['status']='partial'
          d['quality']['all_panel_stats_complete']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TG_TARGET_PANEL_GAP_INJECTED')
          PY

      - name: Terminer le diagnostic
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
          python scripts/diagnostic_3r_page.py

      - name: Vérifier la sémantique LOG1 indisponible
        run: |
          python - <<'PY'
          import json
          l=json.load(open('output/diagnostic-3l-interpretation.json',encoding='utf-8'))
          n=json.load(open('output/diagnostic-3n-hypotheses.json',encoding='utf-8'))
          o=json.load(open('output/diagnostic-3o-synthesis.json',encoding='utf-8'))
          p=json.load(open('output/diagnostic-3p-levers.json',encoding='utf-8'))
          r=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))

          sec={x['id']:x for x in l['sections']}['vacant_stock_profile']
          assert any('indisponible ou incomplet' in s['text'] for s in sec['statements'])
          assert 'G2_no_atypical_vacant_profile' not in {g['id'] for g in n['guardrails']}
          assert o['synthesis']['vacant_stock_profile']['reading']=='profil des logements vacants indisponible ou non comparable'
          s2=[x for x in p['suppressed_levers'] if x['id']=='S2_target_by_vacant_dwelling_profile']
          assert len(s2)==1 and 'indisponible ou non comparable' in s2[0]['reason']
          assert r['quality']['status']=='ok'
          ids={x['id'] for x in r['discriminant_factors']}
          assert 'vacant_apartment_share' not in ids
          assert 'vacant_1946_1990_share' not in ids
          print('3TG_MISSING_TARGET_LOG1_OK')
          PY

  partial_peer_log1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer le diagnostic jusqu'à 3M-P
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py

      - name: Simuler un pair LOG1 absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3mp-panels.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          b=d['blocks']['insee_log1_vacant_profile']
          for key in ('vacant_apartment_share_pct','vacant_1946_1990_share_pct'):
              st=b['stats'][key]
              st['panel_n']=14
          d['quality']['status']='partial'
          d['quality']['all_panel_stats_complete']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TG_PEER_LOG1_GAP_INJECTED')
          PY

      - name: Construire 3M-2 et vérifier le n effectif
        run: |
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3m2_discriminants_extended.py
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m2-discriminants.json',encoding='utf-8'))
          f={x['id']:x for x in d['discriminant_factors']+d['non_discriminant_comparators']}
          assert f['vacant_apartment_share']['reference_panel_n']==14
          assert f['vacant_1946_1990_share']['reference_panel_n']==14
          assert f['population_change']['reference_panel_n']==15
          print('3TG_LOG1_PANEL_N_OK')
          PY
