name: Test DVF 3K-D contract

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/dvf_3kd_contract.py'
      - '.github/workflows/test-dvf-3kd-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le contrat DVF 3K-D
        run: python scripts/dvf_3kd_contract.py
      - name: Vérifier le contrat
        run: |
          test -s output/dvf-3kd-contract.json
          python - <<'PY'
          import json
          d=json.load(open('output/dvf-3kd-contract.json',encoding='utf-8'))
          assert d['territory']=='16015'
          assert d['quality']['status']=='ok'
          assert len(d['series'])==6
          assert d['selected_metrics']['latest_year']>=2024
          assert d['selected_metrics']['residential_sale_mutations_n']>0
          assert d['selected_metrics']['simple_residential_sale_mutations_n']>0
          assert d['selected_metrics']['median_price_m2_eur_simple']>0
          print(json.dumps(d['selected_metrics'],ensure_ascii=False,indent=2))
          PY
      - name: Publier le contrat 3K-D
        uses: actions/upload-artifact@v4
        with:
          name: dvf-3kd-contract
          path: output/dvf-3kd-contract.json
