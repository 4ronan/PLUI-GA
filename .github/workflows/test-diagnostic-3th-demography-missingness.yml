name: Test diagnostic 3T-H demographic missingness

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/insee_3jc_contract.py'
      - 'scripts/diagnostic_3l_interpretation.py'
      - 'scripts/diagnostic_3m_discriminants.py'
      - '.github/workflows/test-diagnostic-3th-demography-missingness.yml'

env:
  DIAG_TERRITORY: '16015'
  DIAG_COMMUNE_NAME: 'Angoulême'
  DIAG_PANEL_CODES: '16102,19031,47001,24322,40192,79191,86066,33243,17299,40088,24037,17415,17306,47323,47157'

jobs:
  missing_target_demography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les contrats source
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py

      - name: Simuler une donnée démographique cible absente
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/insee-3jc-contract.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['metrics']['population_change_pct']=None
          d['metrics']['percentiles']['population_change']=None
          d['quality']['target_missing_indicators']=['population_change']
          d['quality']['status']='partial'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TH_TARGET_DEMOGRAPHY_GAP_INJECTED')
          PY

      - name: Construire le diagnostic complet
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py
          python scripts/diagnostic_3m_discriminants.py
          python scripts/diagnostic_3mp_missing_panels.py
          python scripts/diagnostic_3m2_discriminants_extended.py
          python scripts/diagnostic_3n_hypotheses.py
          python scripts/diagnostic_3o_synthesis.py
          python scripts/diagnostic_3p_levers.py
          python scripts/diagnostic_3q_prioritization.py
          python scripts/diagnostic_3r_page.py

      - name: Vérifier la donnée démographique indisponible
        run: |
          python - <<'PY'
          import json
          l=json.load(open('output/diagnostic-3l-interpretation.json',encoding='utf-8'))
          m=json.load(open('output/diagnostic-3m-discriminants.json',encoding='utf-8'))
          r=json.load(open('output/diagnostic-3r-page.json',encoding='utf-8'))

          sec={x['id']:x for x in l['sections']}['demography_housing']
          assert any('indisponible pour la commune' in s['text'] for s in sec['statements'])
          f={x['id']:x for x in m['discriminant_factors']+m['non_discriminant_comparators']}
          assert f['population_change']['value'] is None
          assert f['population_change']['percentile'] is None
          assert f['population_change']['is_discriminant'] is False
          assert r['quality']['status']=='ok'
          assert 'population_change' not in {x['id'] for x in r['discriminant_factors']}
          print('3TH_MISSING_TARGET_DEMOGRAPHY_OK')
          PY

  partial_peer_demography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer jusqu'à 3L
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/lovac_3kb_contract.py
          python scripts/insee_log1_3kc_contract.py
          python scripts/dvf_3kd_contract.py
          python scripts/sitadel_3ke_contract.py
          python scripts/rpls_3kf_contract.py
          python scripts/insee_3jc_contract.py
          python scripts/filosofi_panel_contract_3icde.py
          python scripts/diagnostic_3kg_assembly.py
          python scripts/diagnostic_3l_interpretation.py

      - name: Simuler un pair indisponible pour la population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/diagnostic-3kg-assembly.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          q=d['blocks']['demography_housing']['quality']
          q['panel_n_by_indicator']['population_change']=14
          q['status']='partial'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('3TH_PEER_DEMOGRAPHY_GAP_INJECTED')
          PY

      - name: Construire 3M et vérifier les n par indicateur
        run: |
          export PYTHONPATH="$PWD/scripts:${PYTHONPATH:-}"
          python scripts/diagnostic_3m_discriminants.py
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m-discriminants.json',encoding='utf-8'))
          f={x['id']:x for x in d['discriminant_factors']+d['non_discriminant_comparators']}
          assert f['population_change']['reference_panel_n']==14
          assert f['households_change']['reference_panel_n']==15
          assert f['secondary_homes_share']['reference_panel_n']==15
          print('3TH_DEMOGRAPHY_PANEL_N_OK')
          PY
