name: Test diagnostic 3M discriminants

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'scripts/diagnostic_3m_discriminants.py'
      - '.github/workflows/test-diagnostic-3m-discriminants.yml'

jobs:
  discriminants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer LOVAC
        run: python scripts/lovac_3kb_contract.py
      - name: Générer INSEE LOG1
        run: python scripts/insee_log1_3kc_contract.py
      - name: Générer DVF
        run: python scripts/dvf_3kd_contract.py
      - name: Générer Sitadel
        run: python scripts/sitadel_3ke_contract.py
      - name: Générer RPLS
        run: python scripts/rpls_3kf_contract.py
      - name: Générer démographie-logement INSEE
        run: python scripts/insee_3jc_contract.py
      - name: Générer Filosofi
        run: python scripts/filosofi_panel_contract_3icde.py
      - name: Assembler 3K-G
        run: python scripts/diagnostic_3kg_assembly.py
      - name: Interpréter 3L
        run: python scripts/diagnostic_3l_interpretation.py
      - name: Détecter 3M
        run: python scripts/diagnostic_3m_discriminants.py

      - name: Vérifier 3M
        run: |
          test -s output/diagnostic-3m-discriminants.json
          python - <<'PY'
          import json
          d=json.load(open('output/diagnostic-3m-discriminants.json',encoding='utf-8'))
          assert d['stage']=='3M'
          assert d['territory']=='16015'
          assert d['source_stage']=='3L'
          assert d['quality']['status']=='ok'
          assert d['quality']['candidate_count']==9
          assert d['quality']['discriminant_count']==4
          assert d['quality']['all_discriminants_have_panel'] is True
          assert d['quality']['causal_claims_included'] is False
          assert d['quality']['recommendations_included'] is False
          assert d['quality']['global_score_included'] is False
          assert d['quality']['ranking_included'] is False
          ids={x['id'] for x in d['discriminant_factors']}
          assert ids=={'median_income','poverty_rate','social_mobility','social_qpv_share'}
          by={x['id']:x for x in d['discriminant_factors']}
          assert round(by['median_income']['percentile'],6)==round(13.333333333333334,6)
          assert round(by['poverty_rate']['percentile'],6)==round(93.33333333333333,6)
          assert round(by['social_mobility']['percentile'],6)==round(86.66666666666667,6)
          assert round(by['social_qpv_share']['percentile'],6)==round(93.33333333333333,6)
          print(json.dumps(d['quality'],ensure_ascii=False,indent=2))
          PY

      - name: Publier 3M
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3m-discriminants
          path: output/diagnostic-3m-discriminants.json
