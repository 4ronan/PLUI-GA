name: Inspect 3V-D Insee zonings

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - '.github/workflows/inspect-diagnostic-3vd-insee-zonings.yml'

concurrency:
  group: inspect-3vd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger les fichiers Insee 2026
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            'https://www.insee.fr/fr/statistiques/fichier/8571524/fichier_diffusion_2026.xlsx' \
            -o /tmp/density.xlsx
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            'https://www.insee.fr/fr/statistiques/fichier/4803954/AAV2020_au_01-01-2026.zip' \
            -o /tmp/aav.zip
          unzip -l /tmp/aav.zip | head -80

      - name: Inspecter les classeurs XLSX sans dépendance externe
        run: |
          python - <<'PY'
          import re, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          NS={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main',
              'r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
              'p':'http://schemas.openxmlformats.org/package/2006/relationships'}

          def col_index(ref):
              letters=''.join(ch for ch in ref if ch.isalpha())
              n=0
              for ch in letters:
                  n=n*26+ord(ch.upper())-64
              return n-1

          def inspect_xlsx(path,label):
              print(f'===== {label}: {path} =====')
              with zipfile.ZipFile(path) as z:
                  shared=[]
                  if 'xl/sharedStrings.xml' in z.namelist():
                      root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                      for si in root.findall('m:si',NS):
                          shared.append(''.join(t.text or '' for t in si.iterfind('.//m:t',NS)))
                  wb=ET.fromstring(z.read('xl/workbook.xml'))
                  relroot=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
                  rels={x.attrib['Id']:x.attrib['Target'] for x in relroot}
                  for sh in wb.find('m:sheets',NS):
                      name=sh.attrib['name']
                      rid=sh.attrib['{'+NS['r']+'}id']
                      target=rels[rid].lstrip('/')
                      if not target.startswith('xl/'): target='xl/'+target
                      target=str(Path(target))
                      print(f'--- SHEET {name!r} -> {target}')
                      root=ET.fromstring(z.read(target))
                      shown=0
                      for row in root.findall('.//m:sheetData/m:row',NS):
                          vals=[]
                          maxcol=-1
                          cells={}
                          for c in row.findall('m:c',NS):
                              idx=col_index(c.attrib.get('r','A1'))
                              typ=c.attrib.get('t')
                              v=c.find('m:v',NS)
                              if typ=='inlineStr':
                                  isel=c.find('m:is',NS)
                                  value=''.join(t.text or '' for t in isel.iterfind('.//m:t',NS)) if isel is not None else ''
                              elif v is None:
                                  value=''
                              elif typ=='s':
                                  value=shared[int(v.text)] if v.text is not None else ''
                              else:
                                  value=v.text or ''
                              cells[idx]=value
                              maxcol=max(maxcol,idx)
                          vals=[cells.get(i,'') for i in range(maxcol+1)]
                          if any(str(x).strip() for x in vals):
                              print(f'ROW {row.attrib.get("r")}: {vals[:25]}')
                              shown+=1
                              if shown>=25: break

          inspect_xlsx('/tmp/density.xlsx','DENSITY')
          with zipfile.ZipFile('/tmp/aav.zip') as z:
              names=[n for n in z.namelist() if n.lower().endswith('.xlsx')]
              print('AAV XLSX MEMBERS',names)
              for i,n in enumerate(names):
                  out=f'/tmp/aav-{i}.xlsx'
                  Path(out).write_bytes(z.read(n))
                  inspect_xlsx(out,f'AAV {n}')
          PY
