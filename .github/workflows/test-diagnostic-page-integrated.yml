name: Test integrated vacancy diagnostic page

on:
  workflow_dispatch:
  push:
    branches: [vacants-rpls-d2]
    paths:
      - 'public/index.html'
      - '.github/workflows/test-diagnostic-page-integrated.yml'

concurrency:
  group: diagnostic-page-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les éléments validés
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert '3V-D-insee-typology-v2' in s
          assert '/api/diagnostics' in s
          assert 'status_url' in s and 'pollJob' in s
          assert 'Commune, code postal ou code INSEE' in s
          assert 'Générer le diagnostic' in s
          assert 'LOVAC bloque si absent' in s
          assert 'contexte absent reste null' in s
          assert '15 comparables automatiques avec DENS7 et AAV' in s
          assert 'Aucune causalité automatique' in s
          assert 'Cognac · code INSEE 16102' in s
          assert 'la vacance privée n’est pas atypique dans le panel' in s
          assert s.count('Panel médian') >= 8
          assert 'Génération / chargement' not in s
          assert 'Les percentiles sont conditionnels à la composition du panel' in s
          assert 'Le navigateur n’effectue aucune inférence métier' in s
          assert 'Sources et millésimes' in s
          assert 'source_provenance' in s
          print('3Y_PAGE_CONTENT_OK')
          PY

      - name: Vérifier la syntaxe JavaScript embarquée
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          assert len(scripts)==1
          Path('/tmp/diagnostic-page.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/diagnostic-page.js

      - name: Vérifier l'absence de dépendance externe obligatoire
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8').lower()
          assert '<script src=' not in s
          assert '<link rel="stylesheet"' not in s
          print('3Y_STANDALONE_OK')
          PY
